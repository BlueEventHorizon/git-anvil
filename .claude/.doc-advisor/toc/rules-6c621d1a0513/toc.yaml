  docs/rules/plugin_uv_usage_rules.md:
    title: uv usage rules
    purpose: Defines rules for running Python scripts and managing their dependencies with uv, covering PEP 723 metadata placement, locking, updating, and a 3-day exclude-newer guard against freshly published versions.
    content_details:
      - Applies only when project instructions adopt uv; distributed scripts would require uv on user machines
      - Dependency declarations go in PEP 723 inline metadata for standalone or distributed scripts, and in pyproject.toml for multi-script groups with shared modules and tests
      - Distributed scripts cannot use pyproject.toml, so shared module dependencies are declared in every entry script that imports them
      - Scripts run via uv run and never directly with system python3; the exclude-newer setting lives in the inline tool.uv metadata
      - Dependencies are added with uv add --script and --bounds lower after user approval, removed with uv remove --script, and never written with hand-typed version numbers
      - uv lock --script pins resolved versions and distribution hashes in a lock file committed with the script; uv run --locked detects mismatches
      - Outdated dependencies are checked with uv tree --outdated and updated with uv lock --upgrade or --upgrade-package, with the lock diff reviewed before commit
      - exclude-newer 3 days drops versions published less than 3 days ago, with exclude-newer-package as an override for urgent security fixes
      - requires-python lower bound follows the latest stable Python, chosen via uv python list excluding alpha, beta and rc
    applicable_tasks:
      - Creation of a Python script that runs or depends on packages via uv
      - Dependency addition or removal in a uv-managed script
      - Lock file regeneration or dependency update with uv lock
      - Review of dependency declaration placement between PEP 723 metadata and pyproject.toml
      - Configuration of the exclude-newer supply chain guard
      - Selection of the requires-python version
    keywords:
      - uv
      - uv run
      - PEP 723
      - inline metadata
      - pyproject.toml
      - uv add
      - uv lock
      - exclude-newer
      - uv.lock
      - requires-python
