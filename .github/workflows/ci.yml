name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: unittest + dprint check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Validate JSON manifests
        run: |
          set -euo pipefail
          for f in .claude-plugin/marketplace.json anvil/.claude-plugin/plugin.json; do
            echo "validate: $f"
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
          done

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Install dprint
        run: curl -fsSL https://dprint.dev/install.sh | sh -s 0.55.1

      - name: Run dprint check
        run: $HOME/.dprint/bin/dprint check
