  docs/rules/plugin_script_error_output_rules.md:
    title: Script error output rules
    purpose: Defines exit code and error output rules for newly placed Claude Code plugin Python scripts, covering exit code meanings, docstring declaration, caller handling, and JSON stdout errors.
    content_details:
      - "Exit codes 0, 1 and 2 have shared meanings: 0 completed, 1 unspecified error, 2 argparse argument error"
      - Codes 3 and above are defined only by the script that returns them, declared in its module docstring with a full table including 0
      - Zero findings or no changes still exit 0 with the result in stdout JSON; the completion judgment excludes result content
      - Callers branch on a value only when the producing script docstring declares it; undeclared values and 1 are handled as a generic error
      - Non-zero exit writes an errors JSON array of natural language strings to stdout; exit 2 is the exception because argparse writes usage to stderr
      - Wrappers passing through other script exit codes must declare the range in their docstring or collapse to 0, 1 and 2
      - Existing scripts are not violations for not following this rule; it applies to newly placed scripts
      - Scripts bound by a harness contract such as Claude Code hooks follow the harness contract instead
    applicable_tasks:
      - Creation of a new plugin Python script with exit code and error output handling
      - Modification of exit codes or error output format of a plugin script
      - Review of plugin script error output compliance
      - Implementation of caller logic that branches on script exit codes
      - Writing the exit code declaration table in a script module docstring
    keywords:
      - exit code
      - error output
      - module docstring
      - argparse
      - sys.exit
      - errors JSON
      - stdout
