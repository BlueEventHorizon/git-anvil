  docs/rules/plugin_implementation_guidelines.md:
    title: Plugin Implementation Guidelines
    purpose: "Defines plugin-independent rules for implementing plugin scripts (Python and Bash) and SKILL.md: language choice, testing, script placement, temp files, no shipped references to dev-only docs, SKILL-only interfaces, and fallback and version-file rules."
    content_details:
      - "Language choice table: Python for data parsing and YAML/JSON, Bash for external commands and file pipes, standard library only unless user approves"
      - "Test requirements: distributed Python scripts must have tests named test_module.py, SKILL.md exempt, AI-judgment tests run manually outside CI"
      - Ban on inline script logic in SKILL.md; call independent scripts via CLAUDE_SKILL_DIR path instead
      - "Placement: skill-specific scripts under skills/skill/scripts, plugin-shared scripts and docs at plugin root, no reference into another skill's directory"
      - Temp files written with Write tool under project .temp/plugin/skill/ with session ID in filename, never via shell heredoc or fixed names
      - Shipped files (SKILL.md, agents, commands, docs, templates) must not reference development-only documents by path or spec ID
      - Other components reached only through SKILL argument and output contract, never direct script calls
      - Unused code deleted rather than commented out or marked deprecated
      - AI-interpreted user input not parsed by scripts; ask user when arguments are missing or ambiguous
      - Fallbacks allowed only when explainable as correct recovery; otherwise report errors explicitly
      - Version files (plugin.json, marketplace.json, README version table, CHANGELOG, git tags) not edited in ordinary work, only in release procedure
    applicable_tasks:
